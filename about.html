<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>

        body { background-color: #050505; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; width: 100%; border: 1px solid #0ff; padding: 40px; border-radius: 15px; background: rgba(0, 20, 20, 0.9); box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); text-align: center; }

        .skills { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 40px; }
        .skill-badge { border: 1px solid #0ff; padding: 8px 15px; border-radius: 20px; color: #0ff; font-weight: bold; }
        .back-btn { text-decoration: none; padding: 10px 30px; background: #0ff; color: #000; font-weight: bold; border-radius: 5px; transition: 0.3s; }
        .back-btn:hover { background: white; box-shadow: 0 0 15px #0ff; }

            আমার লক্ষ্য হলো সুন্দর ডিজাইনের মাধ্যমে ব্যবহারকারীদের ভালো অভিজ্ঞতা দেওয়া।
